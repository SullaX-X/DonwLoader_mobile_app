name: Android CI - Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK Files
        id: prep_apk
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MediaDownloaderPro.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MediaDownloaderPro-${VERSION_TAG}.apk"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderPro-APK
          path: |
            dist/MediaDownloaderPro.apk
            dist/MediaDownloaderPro-${{ steps.prep_apk.outputs.version_tag }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_apk.outputs.version_tag }}
          name: "Media Downloader Pro ${{ steps.prep_apk.outputs.version_tag }}"
          body: |
            ### Media Downloader Pro (${{ steps.prep_apk.outputs.version_tag }})
            Ready-to-install Android APK built automatically by GitHub Actions.
            - Download **`MediaDownloaderPro.apk`** below under **Assets** to install on your Android device.
          files: |
            dist/MediaDownloaderPro.apk
            dist/MediaDownloaderPro-${{ steps.prep_apk.outputs.version_tag }}.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
